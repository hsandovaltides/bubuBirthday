<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz Cumpleaños Bubu 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --vino: #6d1b3c;
    --vino-oscuro: #4a0f28;
    --rosa: #d67b9c;
    --rosa-claro: #f3c9d6;
    --crema: #fff5f0;
    --dorado: #c9a86a;
    --texto: #3d1f2e;
    --sombra: rgba(109, 27, 60, 0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #fff5f0 0%, #f8d7e0 40%, #e8b4c8 75%, #d67b9c 100%);
    background-size: 400% 400%;
    animation: gradientBG 20s ease infinite;
    color: var(--texto);
    overflow-x: hidden;
    min-height: 100vh;
  }
  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.5) 1px, transparent 1px),
      radial-gradient(circle at 80% 70%, rgba(255,255,255,0.4) 1px, transparent 1px),
      radial-gradient(circle at 50% 50%, rgba(255,255,255,0.3) 1px, transparent 1px);
    background-size: 200px 200px, 300px 300px, 150px 150px;
    pointer-events: none;
    z-index: 0;
  }

  section {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
    text-align: center;
    position: relative;
    z-index: 1;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2.8rem;
    margin-bottom: 25px;
    color: var(--vino);
    font-weight: 700;
    letter-spacing: -0.5px;
    line-height: 1.2;
  }
  h2 {
    font-family: 'Playfair Display', serif;
    font-size: 2.2rem;
    margin-bottom: 30px;
    color: var(--vino);
    font-weight: 600;
  }

  /* ---------- CUENTA REGRESIVA ---------- */
  .countdown-title {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 1.15rem;
    color: var(--rosa);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 15px;
    font-weight: 400;
  }

  #countdown-container {
    display: flex;
    gap: 10px;
    flex-wrap: nowrap;
    justify-content: center;
    align-items: stretch;
    margin-top: 20px;
    width: 100%;
    max-width: 480px;
    perspective: 1000px;
  }

  .time-box {
    position: relative;
    flex: 1 1 0;
    min-width: 0;
    background: linear-gradient(160deg, rgba(255,255,255,0.85), rgba(255,245,240,0.7));
    border-radius: 18px;
    padding: 16px 6px 12px;
    box-shadow:
      0 10px 25px var(--sombra),
      0 1px 0 rgba(255,255,255,0.9) inset;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.9);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    overflow: hidden;
    text-align: center;
  }
  .time-box::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--dorado), transparent);
  }
  .time-box:hover {
    transform: translateY(-4px) scale(1.02);
    box-shadow: 0 15px 30px var(--sombra);
  }

  .time-box .num {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    font-weight: 700;
    color: var(--vino);
    line-height: 1;
    display: block;
    font-variant-numeric: tabular-nums;
    transition: transform 0.4s ease, opacity 0.4s ease;
  }
  .time-box .num.flip {
    transform: translateY(-100%);
    opacity: 0;
  }
  .time-box .num.enter {
    animation: slideIn 0.5s ease forwards;
  }
  @keyframes slideIn {
    from { transform: translateY(100%); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .time-box .label {
    font-family: 'Poppins', sans-serif;
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--rosa);
    margin-top: 6px;
    font-weight: 500;
  }

  /* ---------- MENSAJE CUMPLEAÑOS ---------- */
  #happy-msg {
    font-family: 'Playfair Display', serif;
    font-size: 3.5rem;
    color: var(--vino);
    font-weight: 700;
    font-style: italic;
    animation: pop 1.2s ease infinite alternate;
    text-shadow: 0 4px 20px rgba(109,27,60,0.15);
    line-height: 1.2;
  }
  @keyframes pop {
    from { transform: scale(1); }
    to { transform: scale(1.05); }
  }

  /* ---------- IMAGEN PAREJA ---------- */
  .pareja-img {
    width: 240px;
    max-width: 75vw;
    height: auto;
    border-radius: 24px;
    box-shadow:
      0 20px 45px rgba(109,27,60,0.3),
      0 0 0 6px rgba(255,255,255,0.7),
      0 0 0 8px rgba(201,168,106,0.4);
    margin: 15px auto 25px;
    display: block;
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    animation: flotar 4s ease-in-out infinite;
    object-fit: cover;
  }
  .pareja-img:hover { transform: scale(1.05) rotate(-2deg); }
  @keyframes flotar {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .pareja-grande { width: 300px; }

  /* ---------- FRASES ROMÁNTICAS ---------- */
  #frase-romantica {
    margin-top: 35px;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 1.3rem;
    color: var(--vino-oscuro);
    max-width: 560px;
    min-height: 60px;
    padding: 0 25px;
    transition: opacity 0.8s ease, transform 0.8s ease;
    line-height: 1.6;
    position: relative;
    font-weight: 400;
  }
  #frase-romantica::before,
  #frase-romantica::after {
    content: '"';
    font-family: 'Playfair Display', serif;
    font-size: 2.5rem;
    color: var(--dorado);
    position: absolute;
    opacity: 0.5;
    line-height: 1;
  }
  #frase-romantica::before { top: -10px; left: -5px; }
  #frase-romantica::after { bottom: -25px; right: -5px; }
  #frase-romantica.fade {
    opacity: 0;
    transform: translateY(10px);
  }

  /* ---------- GLOBOS ---------- */
  #balloons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 22px;
    max-width: 720px;
    margin-top: 25px;
  }
  .balloon {
    width: 95px;
    height: 115px;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    color: white;
    font-weight: bold;
    box-shadow:
      0 12px 25px rgba(109,27,60,0.25),
      0 0 0 4px rgba(255,255,255,0.6) inset;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s;
    position: relative;
  }
  .balloon::after {
    content: '';
    position: absolute;
    bottom: -22px;
    left: 50%;
    width: 2px;
    height: 22px;
    background: linear-gradient(to bottom, var(--vino), transparent);
    transform: translateX(-50%);
  }
  .balloon:hover {
    transform: scale(1.12) rotate(-4deg);
    box-shadow: 0 18px 35px rgba(109,27,60,0.35);
  }
  .balloon.opened {
    background: var(--crema) !important;
    color: var(--vino) !important;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 0.9rem;
    padding: 12px;
    border-radius: 20px;
    width: 150px;
    height: 150px;
    box-shadow: 0 15px 30px rgba(109,27,60,0.25);
  }

  /* ---------- QUIZ ---------- */
  #quiz-box {
    background: rgba(255, 245, 240, 0.92);
    border-radius: 30px;
    padding: 40px 35px;
    max-width: 520px;
    width: 100%;
    box-shadow:
      0 25px 60px rgba(109,27,60,0.25),
      0 1px 0 rgba(255,255,255,1) inset;
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.8);
  }
  #question {
    font-family: 'Playfair Display', serif;
    font-size: 1.35rem;
    margin-bottom: 25px;
    font-weight: 600;
    color: var(--vino);
    line-height: 1.4;
  }
  .option {
    display: block;
    width: 100%;
    padding: 16px 20px;
    margin: 12px 0;
    border: 2px solid var(--rosa-claro);
    background: rgba(255,255,255,0.9);
    color: var(--vino);
    border-radius: 18px;
    font-size: 1rem;
    font-family: 'Poppins', sans-serif;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    text-align: left;
  }
  .option:hover {
    background: var(--vino);
    color: white;
    border-color: var(--vino);
    transform: translateX(6px);
  }
  .option.correct {
    background: #7fb069;
    color: white;
    border-color: #7fb069;
    animation: acertar 0.5s ease;
  }
  .option.wrong {
    background: #c1455a;
    color: white;
    border-color: #c1455a;
    animation: sacudir 0.4s ease;
  }
  @keyframes acertar {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  @keyframes sacudir {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }
  #quiz-feedback {
    margin-top: 18px;
    font-weight: 600;
    color: var(--vino);
    min-height: 24px;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 1.05rem;
  }
  #quiz-progress {
    margin-top: 15px;
    font-size: 0.85rem;
    color: var(--rosa);
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 500;
  }

  /* ---------- PASTEL ---------- */
  .cake {
    position: relative;
    width: 220px;
    height: 180px;
    margin: 50px auto 20px;
    filter: drop-shadow(0 15px 25px rgba(109,27,60,0.25));
  }
  .plate {
    position: absolute;
    bottom: 0;
    width: 260px;
    height: 20px;
    background: linear-gradient(to bottom, var(--dorado), #a88a4f);
    border-radius: 50%;
    left: -20px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.15);
  }
  .layer {
    position: absolute;
    left: 10px;
    width: 200px;
    border-radius: 12px;
    background: var(--rosa-claro);
    box-shadow: inset 0 -10px 0 rgba(0,0,0,0.06), 0 2px 6px rgba(109,27,60,0.1);
  }
  .layer.bottom { bottom: 20px; height: 70px; background: #c4688a; }
  .layer.middle { bottom: 90px; height: 60px; background: var(--rosa); width: 180px; left: 20px; }
  .layer.top { bottom: 150px; height: 40px; background: var(--rosa-claro); width: 150px; left: 35px; }
  .candle {
    position: absolute;
    bottom: 190px;
    left: 50%;
    transform: translateX(-50%);
    width: 12px;
    height: 45px;
    background: repeating-linear-gradient(45deg, #fff, #fff 5px, var(--rosa) 5px, var(--rosa) 10px);
    border-radius: 4px;
  }
  .flame {
    position: absolute;
    top: -28px;
    left: 50%;
    transform: translateX(-50%);
    width: 18px;
    height: 28px;
    background: radial-gradient(circle at 50% 70%, #fff700, #ff9500, #ff3d00);
    border-radius: 50% 50% 20% 20%;
    animation: flicker 0.4s infinite alternate;
    box-shadow: 0 0 25px #ff9500, 0 0 50px rgba(255,149,0,0.5);
  }
  @keyframes flicker {
    from { transform: translateX(-50%) scale(1) rotate(-2deg); }
    to { transform: translateX(-50%) scale(1.1) rotate(2deg); }
  }
  .flame.off { display: none; }
  .smoke {
    position: absolute;
    top: -30px;
    left: 50%;
    transform: translateX(-50%);
    width: 10px;
    height: 10px;
    background: rgba(150,150,150,0.6);
    border-radius: 50%;
    animation: smokeUp 2s ease-out forwards;
  }
  @keyframes smokeUp {
    to { transform: translate(-50%, -60px) scale(3); opacity: 0; }
  }

  #blow-btn {
    margin-top: 35px;
    padding: 16px 40px;
    border: none;
    background: linear-gradient(135deg, var(--vino), var(--rosa));
    color: white;
    border-radius: 40px;
    font-size: 1.05rem;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    letter-spacing: 0.5px;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(109,27,60,0.35);
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  #blow-btn:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 15px 35px rgba(109,27,60,0.45);
  }
  #wish-msg {
    margin-top: 25px;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 1.4rem;
    color: var(--vino);
    font-weight: 600;
    min-height: 30px;
  }

  /* ---------- UTILS ---------- */
  .hidden { display: none !important; }

  /* ---------- BOTÓN MÚSICA ---------- */
  #music-btn {
    position: fixed;
    top: 22px;
    right: 22px;
    z-index: 1000;
    width: 55px;
    height: 55px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.8);
    background: linear-gradient(135deg, var(--vino), var(--rosa));
    color: white;
    font-size: 1.3rem;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(109,27,60,0.4);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    backdrop-filter: blur(10px);
  }
  #music-btn:hover { transform: scale(1.12) rotate(8deg); }
  #music-btn.playing { animation: pulso 2s infinite; }
  @keyframes pulso {
    0%, 100% { box-shadow: 0 10px 25px rgba(109,27,60,0.4); }
    50% { box-shadow: 0 10px 40px rgba(214,123,156,0.9); }
  }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 600px) {
    section { padding: 40px 14px; }
    h1 { font-size: 1.8rem; margin-bottom: 18px; }
    h2 { font-size: 1.5rem; margin-bottom: 22px; }
    .countdown-title { font-size: 0.9rem; letter-spacing: 2px; margin-bottom: 10px; }
    #happy-msg { font-size: 2rem; }
    #frase-romantica { font-size: 1rem; padding: 0 15px; margin-top: 28px; }
    .pareja-img { width: 180px; margin: 10px auto 20px; }
    .pareja-grande { width: 220px; }

    #countdown-container {
      gap: 7px;
      max-width: 100%;
      padding: 0 4px;
      margin-top: 12px;
    }
    .time-box {
      border-radius: 14px;
      padding: 14px 4px 10px;
    }
    .time-box .num { font-size: 1.55rem; }
    .time-box .label {
      font-size: 0.52rem;
      letter-spacing: 0.5px;
      margin-top: 5px;
    }

    #music-btn { width: 48px; height: 48px; font-size: 1.1rem; top: 14px; right: 14px; }
    #quiz-box { padding: 25px 20px; border-radius: 22px; }
    #question { font-size: 1.15rem; }
    .option { padding: 13px 16px; font-size: 0.95rem; }
    .balloon { width: 80px; height: 98px; font-size: 1.6rem; }
    .balloon.opened { width: 130px; height: 130px; font-size: 0.82rem; }
    .cake { transform: scale(0.9); }
  }

  @media (max-width: 360px) {
    .time-box .num { font-size: 1.3rem; }
    .time-box .label { font-size: 0.45rem; }
    .time-box { padding: 12px 2px 8px; }
  }
</style>
</head>
<body>

<button id="music-btn" title="Poner/quitar música">🔇</button>

<audio id="musica" loop>
  <source src="https://cdn.pixabay.com/audio/2022/10/25/audio_5d6c6c8b26.mp3" type="audio/mpeg">
</audio>

<!-- 1. CUENTA REGRESIVA -->
<section id="sec-countdown">
  <img class="pareja-img" 
       src="https://images.unsplash.com/photo-1518717758536-85ae29035b6d?w=600&q=80" 
       alt="Bubu y Dudu de cumpleaños">
  <p class="countdown-title">✦ Próximamente ✦</p>
  <h1 id="titulo-countdown">El cumpleaños de Bubu</h1>
  <div id="countdown-container"></div>
  <div id="happy-msg" class="hidden">🎉 ¡Feliz Cumpleaños, Bubu! 🎉</div>
  <div id="frase-romantica"></div>
</section>

<!-- 6. MENSAJES SORPRESA -->
<section id="sec-balloons" class="hidden">
  <img class="pareja-img pareja-grande"
       src="https://images.unsplash.com/photo-1518717758536-85ae29035b6d?w=600&q=80"
       alt="Bubu y Dudu festejando">
  <h2>🎈 Un mensaje en cada globo 🎈</h2>
  <div id="balloons"></div>
</section>

<!-- 7. QUIZ -->
<section id="sec-quiz" class="hidden">
  <h2>💘 ¿Cuánto te acuerdas de nosotros?</h2>
  <div id="quiz-box">
    <div id="question"></div>
    <div id="options"></div>
    <div id="quiz-feedback"></div>
    <div id="quiz-progress"></div>
  </div>
</section>

<!-- 8. PASTEL -->
<section id="sec-cake" class="hidden">
  <h2>🎂 Pide un deseo y sopla la vela</h2>
  <div class="cake">
    <div class="plate"></div>
    <div class="layer bottom"></div>
    <div class="layer middle"></div>
    <div class="layer top"></div>
    <div class="candle">
      <div class="flame" id="flame"></div>
    </div>
  </div>
  <button id="blow-btn">Soplar la velita 💨</button>
  <div id="wish-msg"></div>
</section>

<script>
/* ================== CONFIGURACIÓN ================== */
const NOMBRE = "Bubu";
const MES_CUMPLE = 9;   // octubre (0=enero)
const DIA_CUMPLE = 29;

const IMG_PAREJA = "https://images.unsplash.com/photo-1518717758536-85ae29035b6d?w=600&q=80";
const MUSICA_URL = "https://cdn.pixabay.com/audio/2022/10/25/audio_5d6c6c8b26.mp3";

const FRASES = [
  "Cada segundo que pasa me acerca a verte sonreír 💕",
  "Eres lo mejor que me ha pasado, Bubu 🌸",
  "Contarte los días es mi forma de decirte que te extraño 💌",
  "Falta poquito para celebrarte como te mereces 🎁",
  "Mi lugar favorito siempre va a ser a tu lado 🏡",
  "No hay distancia ni tiempo que borre lo que siento por ti ✨",
  "Ya quiero ver tu carita cuando veas la sorpresa 😏",
  "Los días contigo son mis favoritos, y este será especial 🎂"
];
const INTERVALO_FRASE = 5000;

const MENSAJES = [
  "Eres mi persona favorita en el mundo 💕",
  "Amo tu risa, nunca la cambies 😍",
  "Contigo hasta lo aburrido es divertido 🥰",
  "Gracias por existir, Bubu 🌸",
  "Eres mi lugar seguro 🏡",
  "Cada día a tu lado es mi regalo 🎁"
];
const COLORES = ["#6d1b3c", "#d67b9c", "#c9a86a", "#b94e6f", "#a83a5f", "#e8b4c8"];

const PREGUNTAS = [
  { q: "¿Dónde fue nuestra primera cita?", opciones: ["Cine", "Café", "Parque", "Restaurante"], correcta: 1 },
  { q: "¿Cuál es mi comida favorita para compartir contigo?", opciones: ["Pizza", "Sushi", "Helado", "Tacos"], correcta: 0 },
  { q: "¿Qué canción te dediqué?", opciones: ["Perfect", "Yellow", "Dandelions", "Todas las anteriores"], correcta: 3 },
  { q: "¿Qué es lo que más amo de ti?", opciones: ["Tu sonrisa", "Tu forma de ser", "Tu mirada", "Todo lo anterior"], correcta: 3 }
];
/* =================================================== */

document.querySelectorAll(".pareja-img").forEach(img => img.src = IMG_PAREJA);
document.querySelector("#musica source").src = MUSICA_URL;

/* ---------- MÚSICA ---------- */
const musica = document.getElementById("musica");
const musicBtn = document.getElementById("music-btn");

musicBtn.addEventListener("click", () => {
  if (musica.paused) {
    musica.play().then(() => {
      musicBtn.textContent = "🔊";
      musicBtn.classList.add("playing");
    }).catch(() => { musicBtn.textContent = "⚠️"; });
  } else {
    musica.pause();
    musicBtn.textContent = "🔇";
    musicBtn.classList.remove("playing");
  }
});

let primerClic = false;
document.body.addEventListener("click", () => {
  if (!primerClic && musica.paused) {
    primerClic = true;
    musica.play().then(() => {
      musicBtn.textContent = "🔊";
      musicBtn.classList.add("playing");
    }).catch(() => {});
  }
});

/* ---------- FECHAS ---------- */
function esDiaCumple() {
  const hoy = new Date();
  return hoy.getMonth() === MES_CUMPLE && hoy.getDate() === DIA_CUMPLE;
}

function proximoCumple() {
  const hoy = new Date();
  let objetivo = new Date(hoy.getFullYear(), MES_CUMPLE, DIA_CUMPLE, 0, 0, 0);
  if (hoy > objetivo && !esDiaCumple()) objetivo.setFullYear(hoy.getFullYear() + 1);
  return objetivo;
}

/* ---------- FRASES ---------- */
let fraseIdx = 0;
const fraseEl = document.getElementById("frase-romantica");
function mostrarFrase() {
  fraseEl.classList.add("fade");
  setTimeout(() => {
    fraseEl.textContent = FRASES[fraseIdx];
    fraseIdx = (fraseIdx + 1) % FRASES.length;
    fraseEl.classList.remove("fade");
  }, 800);
}
if (!esDiaCumple()) {
  mostrarFrase();
  setInterval(mostrarFrase, INTERVALO_FRASE);
}
